<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif">
  <rect x="3" y="3" width="894" height="474" rx="18" fill="#fdfaf3" stroke="#111111" stroke-width="2"/>

  <!-- File -->
  <rect x="40" y="170" width="120" height="120" rx="12" fill="#f5f0e3" stroke="#111111" stroke-width="2.5"/>
  <text x="100" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">file.dat</text>

  <!-- Chunks inside file -->
  <rect x="58" y="188" width="84" height="24" rx="5" fill="#6dc9c1" stroke="#111111" stroke-width="2"/>
  <text x="100" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#111111">C1</text>
  <rect x="58" y="218" width="84" height="24" rx="5" fill="#ff8a5b" stroke="#111111" stroke-width="2"/>
  <text x="100" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#111111">C2</text>
  <rect x="58" y="248" width="84" height="24" rx="5" fill="#7b8cff" stroke="#111111" stroke-width="2"/>
  <text x="100" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#111111">C3</text>

  <text x="100" y="315" text-anchor="middle" font-size="11" fill="#6b6b65">split into chunks</text>

  <!-- Nodes (boxes) -->
  <!-- Node A -->
  <g>
    <rect x="620" y="60" width="160" height="132" rx="16" fill="#f5f0e3" stroke="#111111" stroke-width="2.5"/>
    <text x="700" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Node A</text>
    <rect x="655" y="130" width="34" height="18" rx="4" fill="#6dc9c1" stroke="#111111" stroke-width="1.5"/>
    <text x="672" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="#111111">C1</text>
    <rect x="697" y="130" width="34" height="18" rx="4" fill="#7b8cff" stroke="#111111" stroke-width="1.5"/>
    <text x="714" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="#111111">C3</text>
  </g>

  <!-- Node B -->
  <g>
    <rect x="620" y="195" width="160" height="132" rx="16" fill="#f5f0e3" stroke="#111111" stroke-width="2.5"/>
    <text x="700" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Node B</text>
    <rect x="655" y="265" width="34" height="18" rx="4" fill="#6dc9c1" stroke="#111111" stroke-width="1.5"/>
    <text x="672" y="278" text-anchor="middle" font-size="10" font-weight="700" fill="#111111">C1</text>
    <rect x="697" y="265" width="34" height="18" rx="4" fill="#ff8a5b" stroke="#111111" stroke-width="1.5"/>
    <text x="714" y="278" text-anchor="middle" font-size="10" font-weight="700" fill="#111111">C2</text>
  </g>

  <!-- Node C -->
  <g>
    <rect x="620" y="330" width="160" height="132" rx="16" fill="#f5f0e3" stroke="#111111" stroke-width="2.5"/>
    <text x="700" y="385" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Node C</text>
    <rect x="655" y="400" width="34" height="18" rx="4" fill="#ff8a5b" stroke="#111111" stroke-width="1.5"/>
    <text x="672" y="413" text-anchor="middle" font-size="10" font-weight="700" fill="#111111">C2</text>
    <rect x="697" y="400" width="34" height="18" rx="4" fill="#7b8cff" stroke="#111111" stroke-width="1.5"/>
    <text x="714" y="413" text-anchor="middle" font-size="10" font-weight="700" fill="#111111">C3</text>
  </g>

  <!-- Replication lines: C1 (teal) -> Node A, Node B -->
  <path d="M 142 200 C 320 130, 480 100, 655 130" fill="none" stroke="#6dc9c1" stroke-width="2.5"/>
  <path d="M 142 205 C 320 240, 480 260, 655 270" fill="none" stroke="#6dc9c1" stroke-width="2.5"/>

  <!-- C2 (orange) -> Node B, Node C -->
  <path d="M 142 230 C 320 250, 480 265, 655 274" fill="none" stroke="#ff8a5b" stroke-width="2.5"/>
  <path d="M 142 235 C 320 340, 480 400, 655 405" fill="none" stroke="#ff8a5b" stroke-width="2.5"/>

  <!-- C3 (purple) -> Node A, Node C -->
  <path d="M 142 260 C 320 190, 480 145, 697 135" fill="none" stroke="#7b8cff" stroke-width="2.5"/>
  <path d="M 142 265 C 320 350, 480 415, 697 409" fill="none" stroke="#7b8cff" stroke-width="2.5"/>

  <!-- Metadata box -->
  <rect x="300" y="330" width="230" height="68" rx="12" fill="#ffd93d" stroke="#111111" stroke-width="2.5"/>
  <text x="415" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#111111">Metadata</text>
  <text x="415" y="376" text-anchor="middle" font-size="10.5" fill="#111111">chunk → node placement</text>

  <path d="M 415 330 C 415 300, 350 220, 300 200" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 530 350 C 570 320, 600 260, 620 250" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="450" y="40" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.05em" fill="#6b6b65">EACH CHUNK REPLICATED ACROSS TWO OF THREE NODES</text>
</svg>
