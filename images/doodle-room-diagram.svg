<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif">
  <rect x="3" y="3" width="894" height="454" rx="18" fill="#fdfaf3" stroke="#111111" stroke-width="2"/>

  <text x="450" y="36" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.05em" fill="#6b6b65">TWO SERVERS SHARING ONE CLIENT, ONE OWNS A TURN LOOP</text>

  <!-- Browser -->
  <rect x="40" y="140" width="150" height="90" rx="14" fill="#f5f0e3" stroke="#111111" stroke-width="2.5"/>
  <text x="115" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Browser</text>
  <text x="115" y="200" text-anchor="middle" font-size="10.5" fill="#6b6b65">pictionary.html</text>

  <path d="M 198 161 L 258 113" stroke="#111111" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 197 214 L 260 249" stroke="#111111" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- WhiteboardServer -->
  <rect x="274" y="60" width="290" height="90" rx="14" fill="#6dc9c1" stroke="#111111" stroke-width="2.5"/>
  <text x="419" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">WhiteboardServer, port 8080</text>
  <text x="419" y="116" text-anchor="middle" font-size="10.5" fill="#111111">free draw, just relays events</text>
  <text x="419" y="132" text-anchor="middle" font-size="10.5" fill="#111111">to everyone in the room</text>

  <!-- PictionaryServer -->
  <rect x="274" y="210" width="290" height="90" rx="14" fill="#ff8a5b" stroke="#111111" stroke-width="2.5"/>
  <text x="419" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">PictionaryServer, port 8081</text>
  <text x="419" y="266" text-anchor="middle" font-size="10.5" fill="#111111">game mode, owns turns,</text>
  <text x="419" y="282" text-anchor="middle" font-size="10.5" fill="#111111">timers, and scoring</text>

  <path d="M 572 255 L 604 255" stroke="#111111" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Turn state machine, owned by PictionaryServer -->
  <g>
    <rect x="614" y="200" width="126" height="46" rx="10" fill="#f5f0e3" stroke="#111111" stroke-width="2"/>
    <text x="677" y="228" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111111">LOBBY</text>
  </g>
  <path d="M 677 252 L 677 268" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g>
    <rect x="614" y="274" width="126" height="46" rx="10" fill="#f5f0e3" stroke="#111111" stroke-width="2"/>
    <text x="677" y="302" text-anchor="middle" font-size="10" font-weight="700" fill="#111111">PICKING_WORD</text>
  </g>
  <path d="M 677 326 L 677 342" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g>
    <rect x="614" y="348" width="126" height="46" rx="10" fill="#f5f0e3" stroke="#111111" stroke-width="2"/>
    <text x="677" y="376" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111111">DRAWING</text>
  </g>

  <path d="M 748 371 C 800 371, 800 250, 748 223" stroke="#111111" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="838" y="300" text-anchor="middle" font-size="10" fill="#6b6b65">TURN_END,</text>
  <text x="838" y="314" text-anchor="middle" font-size="10" fill="#6b6b65">next turn</text>
  <text x="838" y="328" text-anchor="middle" font-size="10" fill="#6b6b65">or GAME_OVER</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>
</svg>
