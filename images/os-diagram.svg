<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif">
  <rect x="3" y="3" width="894" height="454" rx="18" fill="#fdfaf3" stroke="#111111" stroke-width="2"/>

  <text x="450" y="42" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.05em" fill="#6b6b65">EACH LAYER IS BUILT ON TOP OF THE ONE BELOW IT</text>

  <!-- Filesystem (top) -->
  <rect x="220" y="70" width="460" height="80" rx="14" fill="#ff8a5b" stroke="#111111" stroke-width="2.5"/>
  <text x="450" y="103" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">Networked Filesystem</text>
  <text x="450" y="125" text-anchor="middle" font-size="12" fill="#111111">reads and writes go through the pager and threads below</text>

  <path d="M 450 156 L 450 172" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Thread library (middle) -->
  <rect x="140" y="182" width="620" height="80" rx="14" fill="#ffd93d" stroke="#111111" stroke-width="2.5"/>
  <text x="450" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">Thread Library</text>
  <text x="450" y="237" text-anchor="middle" font-size="12" fill="#111111">scheduling, context switching, synchronization primitives</text>

  <path d="M 450 268 L 450 284" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Virtual memory pager (bottom of the three) -->
  <rect x="60" y="294" width="780" height="80" rx="14" fill="#6dc9c1" stroke="#111111" stroke-width="2.5"/>
  <text x="450" y="327" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">Virtual Memory Pager</text>
  <text x="450" y="349" text-anchor="middle" font-size="12" fill="#111111">page tables, page fault handling</text>

  <path d="M 450 380 L 450 396" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Hardware base -->
  <rect x="14" y="404" width="872" height="44" rx="10" fill="#111111"/>
  <text x="450" y="432" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.08em" fill="#fdfaf3">CPU / HARDWARE</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>
</svg>
